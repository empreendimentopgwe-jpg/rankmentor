<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Classificação de Mentor</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/config.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Classificação <span style="color:var(--primary)">de Mentor</span></h1>
      <p class="sub" id="subtitle">Entre com sua conta para ver seu ranking real.</p>

      <div id="nameField" style="display:none">
        <label>Nome</label>
        <input id="name" type="text" placeholder="Seu nome" />
      </div>

      <label>E-mail</label>
      <input id="email" type="email" placeholder="voce@email.com" />

      <label>Senha</label>
      <input id="password" type="password" placeholder="••••••••" />

      <div class="error-box" id="errorBox"></div>

      <button class="primary" id="submitBtn">Entrar</button>

      <p class="switch-link">
        <span id="switchText">Ainda não tem conta?</span>
        <a href="#" id="switchLink">Criar conta</a>
      </p>
    </div>
  </div>

  <script>
    let mode = "login"; // ou "register"

    const nameField = document.getElementById("nameField");
    const subtitle = document.getElementById("subtitle");
    const submitBtn = document.getElementById("submitBtn");
    const switchText = document.getElementById("switchText");
    const switchLink = document.getElementById("switchLink");
    const errorBox = document.getElementById("errorBox");

    function setMode(next) {
      mode = next;
      const isRegister = mode === "register";
      nameField.style.display = isRegister ? "block" : "none";
      subtitle.textContent = isRegister
        ? "Crie sua conta para entrar na arena."
        : "Entre com sua conta para ver seu ranking real.";
      submitBtn.textContent = isRegister ? "Criar conta" : "Entrar";
      switchText.textContent = isRegister ? "Já tem conta?" : "Ainda não tem conta?";
      switchLink.textContent = isRegister ? "Entrar" : "Criar conta";
      errorBox.classList.remove("show");
    }

    switchLink.addEventListener("click", (e) => {
      e.preventDefault();
      setMode(mode === "login" ? "register" : "login");
    });

    submitBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const name = document.getElementById("name").value.trim();

      errorBox.classList.remove("show");

      if (!email || !password || (mode === "register" && !name)) {
        errorBox.textContent = "Preencha todos os campos.";
        errorBox.classList.add("show");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Aguarde...";

      try {
        const endpoint = mode === "register" ? "/api/auth/register" : "/api/auth/login";
        const body = mode === "register" ? { name, email, password } : { email, password };

        const res = await fetch(`${window.API_BASE_URL}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Não foi possível continuar.");
        }

        localStorage.setItem("mr_token", data.token);
        localStorage.setItem("mr_user", JSON.stringify(data.user));
        window.location.href = "/";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
      } finally {
        submitBtn.disabled = false;
        setMode(mode);
      }
    });
  </script>
</body>
</html>
